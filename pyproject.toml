[project]
name = "hermes-skills"
version = "0.1.0"
description = "Custom skills for Hermes Agent"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"openclaw-imports/*/scripts/*.py" = ["E402"]
"openclaw-imports/check-market-movers/scripts/*.py" = ["E402"]
"tests/*" = ["E402"]
